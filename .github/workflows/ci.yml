name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  firmware-lint:
    name: Firmware Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 clang-tidy-14
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-14 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-14 100

      - name: Check C++ formatting (base)
        run: |
          find firmware-base/src -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror
      
      - name: Check C++ formatting (rim)
        run: |
          find firmware-rim/src -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror
      
      - name: Check C++ formatting (shared)
        run: |
          find shared -name "*.h" | \
            xargs clang-format --dry-run --Werror

      # Note: clang-tidy requires compile_commands.json from PlatformIO
      # Skipping for now, but could be enabled with:
      # - name: Run clang-tidy
      #   run: pio run -d firmware-base -t compiledb && clang-tidy ...

  firmware-build:
    name: Firmware Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [firmware-base, firmware-rim]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ${{ matrix.target }}/.pio
          key: pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/platformio.ini', 'shared/**') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.target }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ${{ matrix.target }}
        run: pio run -d ${{ matrix.target }}

      - name: Check firmware size
        run: |
          SIZE=$(stat -c%s ${{ matrix.target }}/.pio/build/pico/firmware.bin)
          MAX_SIZE=$((192 * 1024))  # 192KB (leave room for OTA staging)
          echo "Firmware size: $SIZE bytes (max: $MAX_SIZE)"
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "ERROR: Firmware too large!"
            exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-firmware
          path: ${{ matrix.target }}/.pio/build/pico/firmware.*
          retention-days: 7

  firmware-tests:
    name: Firmware Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [firmware-base, firmware-rim]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Run native tests
        run: |
          # Check if test environment exists
          if grep -q "\[env:native\]" ${{ matrix.target }}/platformio.ini; then
            pio test -d ${{ matrix.target }} -e native
          else
            echo "No native test environment configured yet"
          fi

  gui-lint:
    name: GUI Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ffb-config
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/ffb-config/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript formatting
        run: npm run format:check || echo "::warning::Format check not configured yet"

      - name: Run ESLint
        run: npm run lint || echo "::warning::ESLint not configured yet"

  gui-build:
    name: GUI Build Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    defaults:
      run:
        working-directory: tools/ffb-config
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libayatana-appindicator3-dev \
            libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/ffb-config/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/ffb-config/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Check Rust formatting
        working-directory: tools/ffb-config/src-tauri
        run: cargo fmt --check

      - name: Run Rust lints
        working-directory: tools/ffb-config/src-tauri
        run: cargo clippy -- -D warnings

      - name: Build GUI
        run: npm run tauri -- build --no-bundle

  gui-tests:
    name: GUI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ffb-config
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/ffb-config/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "::warning::Tests not configured yet"

      - name: Upload coverage
        if: always()
        run: echo "::notice::Code coverage reporting not yet configured"

  docs-check:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links in markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@v5
        with:
          files: |
            **/*.md
            **/*.cpp
            **/*.h
          config: .github/cspell.json
          incremental_files_only: false

      - name: Validate CHANGELOG
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff origin/${{ github.base_ref }} --name-only | grep -q "CHANGELOG.md"; then
            echo "::warning::Consider updating CHANGELOG.md for this PR"
          fi

  size-tracking:
    name: Track Binary Sizes
    runs-on: ubuntu-latest
    needs: [firmware-build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download base firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-base-firmware
          path: firmware-base-built

      - name: Download rim firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-rim-firmware
          path: firmware-rim-built

      - name: Compare sizes
        run: |
          BASE_SIZE=$(stat -c%s firmware-base-built/firmware.bin)
          RIM_SIZE=$(stat -c%s firmware-rim-built/firmware.bin)
          
          echo "## Firmware Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Size | Limit | Usage |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          
          BASE_PERCENT=$((BASE_SIZE * 100 / (192 * 1024)))
          echo "| Base | $BASE_SIZE bytes | 192 KB | ${BASE_PERCENT}% |" >> $GITHUB_STEP_SUMMARY
          
          RIM_PERCENT=$((RIM_SIZE * 100 / (192 * 1024)))
          echo "| Rim | $RIM_SIZE bytes | 192 KB | ${RIM_PERCENT}% |" >> $GITHUB_STEP_SUMMARY

  protocol-version-check:
    name: Protocol Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protocol version
        run: |
          # Extract protocol version from ffb_link.h
          VERSION=$(grep "static constexpr uint8_t kVersion" shared/ffb_link.h | \
                    sed 's/.*= *\([0-9]*\).*/\1/')
          echo "Current protocol version: $VERSION"
          
          # Check if ffb_link.h changed in this PR
          if git diff --name-only origin/${{ github.base_ref || 'main' }} | grep -q "shared/ffb_link.h"; then
            echo "::warning::Protocol file changed - ensure backward compatibility!"
            echo "::warning::Consider incrementing kVersion if breaking changes"
          fi

  all-checks-complete:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - firmware-lint
      - firmware-build
      - firmware-tests
      - gui-lint
      - gui-build
      - gui-tests
      - docs-check
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed!"
