name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    types: [ opened, synchronize, reopened ]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  firmware-tests:
    name: Firmware Unit Tests (C++)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ lcov
    
    - name: Build tests
      working-directory: firmware-tests
      env:
        CC: gcc
        CXX: g++
      run: |
        mkdir -p build
        cd build
        cmake ..
        cmake --build .
    
    - name: Run tests
      working-directory: firmware-tests/build
      run: |
        ./firmware_unit_tests --gtest_output=xml:test_results.xml
    
    - name: Generate coverage
      if: success()
      continue-on-error: true
      working-directory: firmware-tests/build
      run: |
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/googletest/*' --output-file coverage.info
        lcov --list coverage.info
        genhtml coverage.info --output-directory coverage_html
    
    - name: Upload coverage
      if: success()
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        files: ./firmware-tests/build/coverage.info
        flags: firmware
        name: firmware-coverage
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-test-results
        path: firmware-tests/build/test_results.xml
  
  rust-tests:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential curl wget file libssl-dev \
          libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libudev-dev
    
    - name: Run tests with coverage
      working-directory: tools/ffb-config/src-tauri
      run: |
        cargo llvm-cov test --all-features --lcov --output-path lcov.info
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./tools/ffb-config/src-tauri/lcov.info
        flags: rust
        name: rust-coverage
  
  javascript-tests:
    name: JavaScript Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: tools/ffb-config/package-lock.json
    
    - name: Install dependencies
      working-directory: tools/ffb-config
      run: npm ci
    
    - name: Run tests with coverage
      working-directory: tools/ffb-config
      run: npm run test:coverage
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./tools/ffb-config/coverage/lcov.info
        flags: javascript
        name: javascript-coverage
  
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: false  # Disabled: too slow and often hangs
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: tools/ffb-config/package-lock.json
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-mutants
      run: cargo install cargo-mutants
    
    - name: Install JS dependencies
      working-directory: tools/ffb-config
      run: npm ci
    
    - name: Run JavaScript mutation tests
      working-directory: tools/ffb-config
      run: npm run test:mutants
      continue-on-error: true
    
    - name: Run Rust mutation tests
      working-directory: tools/ffb-config/src-tauri
      run: cargo mutants -- --all-features
      continue-on-error: true
    
    - name: Upload mutation results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-results
        path: |
          tools/ffb-config/reports/
          tools/ffb-config/src-tauri/mutants.out/
  
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [firmware-tests, rust-tests, javascript-tests]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "Firmware tests: ${{ needs.firmware-tests.result }}"
        echo "Rust tests: ${{ needs.rust-tests.result }}"
        echo "JavaScript tests: ${{ needs.javascript-tests.result }}"
        
        # Fail if any required test job failed
        if [[ "${{ needs.firmware-tests.result }}" == "failure" ]]; then
          echo "❌ Firmware tests failed"
          exit 1
        fi
        if [[ "${{ needs.rust-tests.result }}" == "failure" ]]; then
          echo "❌ Rust tests failed"
          exit 1
        fi
        if [[ "${{ needs.javascript-tests.result }}" == "failure" ]]; then
          echo "❌ JavaScript tests failed"
          exit 1
        fi
        
        echo "✅ All required tests passed!"
