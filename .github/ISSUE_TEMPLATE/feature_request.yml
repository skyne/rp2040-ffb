name: Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Help us understand what you'd like to see added to rp2040-ffb.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - Firmware (new sensor support, FFB algorithm)
        - Hardware (PCB, mount, connector)
        - GUI (new settings, visualization)
        - Documentation (guide, tutorial)
        - Testing (automated tests, simulator)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Currently, there's no way to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Add a setting in the GUI that allows...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: I could manually adjust X, but it would be better if...
    validations:
      required: false

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Who would benefit from this feature?
      placeholder: |
        - New builders would find it easier to...
        - Advanced users could optimize...
        - Developers could test...
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Do you have technical ideas about how this could be implemented?
      placeholder: This could be added by modifying XYZ...
    validations:
      required: false

  - type: dropdown
    id: willing
    attributes:
      label: Contribution
      description: Are you willing to help implement this feature?
      options:
        - Yes, I can code this
        - Yes, I can test this
        - Yes, I can write documentation
        - No, but I'd be happy to test it
        - Not sure
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, diagrams, or links to similar implementations
      placeholder: Add any other context or examples here
    validations:
      required: false
