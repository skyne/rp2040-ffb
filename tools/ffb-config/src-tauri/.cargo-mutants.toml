# cargo-mutants configuration
minimum_test_timeout = 20

# Exclude generated code and external dependencies
exclude_globs = [
    "target/**",
    "gen/**",
]

# Run tests in release mode for faster mutation testing
build_command = "cargo build --release"
test_command = "cargo test --release"

# Output configuration
output_dir = "mutants.out"

# Baseline timeout multiplier
baseline_timeout_multiplier = 2.0
