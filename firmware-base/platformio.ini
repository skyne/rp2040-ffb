; CI / pack default: env:pico (BTS7960). Bench MC33926: pio run -e pico-mc33926-home
[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
monitor_speed = 115200
monitor_dtr = 1
monitor_filters = direct
build_flags =
	-DENABLE_USB_HID=1
	-DENABLE_USB_HID_PID=1
	-DENABLE_BASE_EPD=0
	-I../shared
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.3
	zinggjm/GxEPD2 @ ^1.6.2
	adafruit/Adafruit GFX Library @ ^1.11.11
; E-ink off (ENABLE_BASE_EPD=0) — epd_status.cpp keeps stubs; set =1 to drive the panel.
; PID FFB on; HID reports gated until after INIT.

; Pololu Dual MC33926 bench build (swap back to env:pico for BTS7960 / IBT-2).
; Thermal watchdog off — 60s limit fights long FFB/INIT bench sessions.
; Duty raised hard: shield stays cool on this geared wheel even at high PWM;
; heat needs sustained current — still watch nSF / overcurrent latch.
[env:pico-mc33926]
extends = env:pico
build_flags =
	${env:pico.build_flags}
	-DMOTOR_DRIVER_MC33926
	-DMOTOR_OUTPUT_SIGN=-1.0f
	-DMOTOR_WATCHDOG_MAX_ON_MS=0
	-DMOTOR_WATCHDOG_COOLDOWN_MS=0
	-DMOTOR_DUTY_CAP=0.95f
	-DFFB_TORQUE_CAP=0.95f

; MC33926 + motorized magnet INIT at boot (bench only!).
; Same duty for seek/measure/to0; virtual 0 from AXLE_INDEX_ANGLE_DEG after window mid.
[env:pico-mc33926-home]
extends = env:pico
build_flags =
	${env:pico.build_flags}
	-DMOTOR_DRIVER_MC33926
	-DMOTOR_OUTPUT_SIGN=-1.0f
	-DHOME_BOOT_USE_MOTORS=1
	-DHOME_USE_ADXL=0
	-DHOME_SEEK_TRAVEL_DEG=380.0f
	-DHOME_MOTOR_TIMEOUT_MS=120000u
	-DHOME_MOTOR_DUTY=0.20f
	-DHOME_MEASURE_DUTY=0.12f
	-DHOME_MOTION_STALL_MS=10000u
	-DHOME_ENCODER_PROGRESS_MS=0
	-DHOME_ZERO_TOLERANCE_DEG=2.5f
	-DHOME_INDEX_WINDOW_PASSES=2
	-DHOME_INDEX_CLEARANCE_DEG=15.0f
	-DMOTOR_DUTY_CAP=0.95f
	-DFFB_TORQUE_CAP=0.95f
	-DMOTOR_WATCHDOG_MAX_ON_MS=0
	-DMOTOR_WATCHDOG_COOLDOWN_MS=0
